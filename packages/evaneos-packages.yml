note: >-
  Evaneos publishes real first-party open-source libraries under the @evaneos npm scope and the
  evaneos Packagist vendor, but NONE of them is a client SDK for an Evaneos API — there is no
  public Evaneos API to wrap. Every package below is internal engineering tooling: shared
  lint/tsconfig, an internal B2B React component library, a PHP framework stack, an AMQP
  messaging component, a JWT utility and an internal asset-service SDK (Gringotts is an Evaneos
  internal microservice, not a public product). No `SDKs` pointer is emitted for this artifact
  because emitting one would credit Evaneos with API client libraries it does not ship.
