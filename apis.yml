aid: evaneos
name: Evaneos
description: 'Evaneos is a French online marketplace for tailor-made travel, founded in 2009 and
  headquartered in Paris. It connects travelers directly with a curated, continuously-evaluated network
  of 600+ expert local travel agencies across 160+ destinations, who design fully customized itineraries.
  A certified B Corp since 2022, Evaneos champions an ethical model in which at least 85% of each trip''s
  cost benefits local economies, and it has served more than 800,000 travelers at a 97% satisfaction rate.
  Backed by Partech, the company runs a coordinated vulnerability disclosure program but publishes no
  public product API; its GitHub organization hosts internal DevOps, security, and AI tooling.'
